# HoMM3 Browser Clone - Definitive Technical Requirements
# Generated from: official wikis, VCMI modding docs, community research
# Purpose: AI prompt engineering reference for high-quality implementation
# Date: 2026-03-14

meta:
  game: "Heroes of Might and Magic III: The Restoration of Erathia (1999)"
  base_resolution: "800x600 pixels (original); HD mod targets 1024x600 to 1920x1080"
  engine_type: "Turn-based strategy with hexagonal combat"
  reference_implementations:
    - url: "https://github.com/HeroWO-js/Core"
      description: "Most complete JS reimplementation - full map, combat, spells, multiplayer"
    - url: "https://github.com/xorinzor/HOMM3"
      description: "MelonJS-based browser remake"
    - url: "https://github.com/mwardrop/HOMM3Clone"
      description: "HTML5 Canvas clone with A* pathfinding, websockets, collision"
    - url: "https://github.com/Hydraaaaa/HoMM3ServerAuthoritative"
      description: "Server-authoritative browser multiplayer remake"
    - url: "https://github.com/srg-kostyrko/homm3-parser"
      description: "Binary resource parser (.h3m files, DEF animations)"

# ============================================================
# SECTION 1: COMBAT SCREEN VISUAL LAYOUT
# ============================================================

combat_screen:
  total_resolution: "800x600 px"

  battlefield:
    grid_type: "hexagonal offset grid"
    columns: 15
    rows: 11
    total_hexes: 165
    hex_orientation: "flat-top (pointy sides up)"
    # Each hex is roughly 44px wide x 38px tall at 800x600
    approximate_hex_width_px: 44
    approximate_hex_height_px: 38
    battlefield_area_px: "593 x 417 (approximate, leaving room for UI panels)"

  ui_panels:
    right_panel:
      position: "far right, full height"
      width_px: ~200
      contents:
        - "Attacker hero portrait (top left quadrant)"
        - "Defender hero portrait (top right quadrant)"
        - "7 creature stack slots per hero (attacker left, defender right)"
        - "Each stack slot: creature icon + count number"
        - "WAIT button"
        - "DEFEND button"
        - "Auto-combat toggle"
        - "Spell book button"
        - "End combat / Surrender / Flee buttons"

    bottom_panel:
      position: "bottom strip"
      height_px: ~70
      contents:
        - "Combat log scrollable text (center)"
        - "Combat options icon (bottom left)"
        - "Hero spell point bar (mana bar)"
        - "Current unit name + count display"

    combat_log:
      position: "bottom center"
      type: "scrolling text box"
      shows: "damage dealt, spells cast, morale events, kills"

  terrain_backgrounds:
    # Each terrain type has a distinct painted background artwork
    types:
      grass:
        description: "Rolling green hills, trees, flowers, ruins"
        native_factions: ["Castle", "Rampart", "Conflux"]
      dirt:
        description: "Brown earth, dead trees, fences, graves"
        native_factions: ["Necropolis"]
      lava:
        description: "Volcanic rock, flowing orange lava rivers, ash"
        native_factions: ["Inferno"]
      snow:
        description: "White snowfields, pine trees, frozen ground, rocks"
        native_factions: ["Tower", "Fortress (partial)"]
      subterranean:
        description: "Underground cave floor, stalactites, rock walls, dim light"
        native_factions: ["Dungeon (partial)"]
      rough:
        description: "Rocky highland wasteland, sparse vegetation"
        native_factions: ["Stronghold"]
      sand:
        description: "Desert sand dunes, scattered rocks, sparse palms"
        native_factions: ["none default"]
      swamp:
        description: "Murky green water, lily pads, mossy ground, fog"
        native_factions: ["Fortress", "Cove"]

    native_terrain_bonus:
      attack: +1
      defense: +1
      speed: +1
      note: "Applies when creature fights on its faction's native terrain"

  siege_combat_additions:
    enabled_when: "attacking a town with Fort/Citadel/Castle built"
    elements:
      - "Castle walls (destructible with Earthquake spell or Catapult)"
      - "Gate (blocks hex, can be destroyed)"
      - "Arrow towers (shoot automatically each round)"
      - "Moat (creatures entering stop for 1 round, take damage)"
      - "Catapult (attacker war machine, targets walls)"

# ============================================================
# SECTION 2: VISUAL QUALITY - WHAT SEPARATES HoMM3 FROM CHEAP CLONES
# ============================================================

visual_quality:

  sprite_rendering_approach:
    technique: "Pre-rendered 3D models baked to 2D sprites (not hand-drawn pixel art)"
    result: "Smooth shading, realistic proportions, subtle 3D depth"
    format: "DEF files (proprietary animation container)"
    palette: "256 RGBA colors per DEF file"

  creature_animation_system:
    # VCMI animation group IDs (authoritative reference)
    animation_groups:
      0:  {name: "Movement",          frames_typical: "8-16"}
      1:  {name: "Mouse Over / Idle", frames_typical: "4-8"}
      2:  {name: "Idle loop",         frames_typical: "4-8"}
      3:  {name: "Hit (being struck)", frames_typical: "3-6"}
      4:  {name: "Defend / Block",    frames_typical: "3-6"}
      5:  {name: "Death (melee)",     frames_typical: "8-12"}
      6:  {name: "Death (ranged)",    frames_typical: "8-12"}
      7:  {name: "Turn Left",         frames_typical: "3-5"}
      8:  {name: "Turn Right",        frames_typical: "3-5"}
      11: {name: "Attack Up-Diagonal",    frames_typical: "6-10"}
      12: {name: "Attack Straight",       frames_typical: "6-10"}
      13: {name: "Attack Down-Diagonal",  frames_typical: "6-10"}
      14: {name: "Shoot Up-Diagonal",     frames_typical: "6-10"}
      15: {name: "Shoot Straight",        frames_typical: "6-10"}
      16: {name: "Shoot Down-Diagonal",   frames_typical: "6-10"}
      17: {name: "Special Attack Up",     frames_typical: "6-12"}
      18: {name: "Special Attack Front",  frames_typical: "6-12"}
      19: {name: "Special Attack Down",   frames_typical: "6-12"}
      20: {name: "Movement Start",    frames_typical: "3-5"}
      21: {name: "Movement End",      frames_typical: "3-5"}
      22: {name: "Dead (persistent)", frames_typical: "1"}
      24: {name: "Resurrection",      frames_typical: "8-12"}
      30: {name: "Spellcast Up",      frames_typical: "6-10"}
      31: {name: "Spellcast Front",   frames_typical: "6-10"}
      32: {name: "Spellcast Down",    frames_typical: "6-10"}

    notes: "Total animation frames per creature: typically 60-120 frames across all groups"
    idle_behavior: "Creatures constantly cycle through idle animation (breathing, shifting weight)"

  creature_sprite_requirements:
    minimum_quality:
      - "Smooth multi-directional animations (up, front, down attack angles)"
      - "Death animation that ends in a corpse frame (not disappear)"
      - "Walking animation that synchronizes with hex movement speed"
      - "Hit flash effect (sprite briefly lights up white/red on damage)"
      - "2-hex creatures (Dragons, etc.) occupy two hexes on grid"
    quality_markers_that_separate_from_cheap:
      - "Idle breathing cycle animation (not static standing)"
      - "Distinct attack animations for different directions (up/straight/down)"
      - "Corpse sprites remain on field until combat ends"
      - "Large creatures have proportionally large sprites with visible detail"
      - "Projectile sprites for ranged units (arrows, bolts, magic missiles)"

  spell_effects:
    visual_style: "Large painted overlay effects, particle burst animations"
    key_effects:
      lightning_bolt: "Jagged white/yellow bolt from sky to target hex"
      fireball: "Orange explosion covering 7 hexes, scorch ring"
      armageddon: "Full screen red flame wash over entire battlefield"
      ice_bolt: "Blue ice crystal shard projectile + blue explosion"
      meteor_shower: "Multiple rocks falling with impact craters"
      animate_dead: "Green necromantic glow around resurrected creatures"
      resurrection: "Golden angelic light from above"
      chain_lightning: "Lightning jumps visibly between up to 5 targets"
      bless: "Golden aura appearing around creature"
      slow: "Blue-grey veil settling over creature (slowed appearance)"
      haste: "Green speed-lines/blur around creature"
      blind: "Dark veil / grey-out effect over creature"
      berserk: "Red rage aura / flames around creature"

    quality_requirement: "Effects must visually overlap the battlefield art and animate for 0.5-1.5 seconds"

  damage_numbers:
    style: "Floating text appearing above struck creature"
    color: "Yellow or white numbers, red for large damage"
    animation: "Rise upward and fade over ~1 second"
    content: "Shows exact damage value dealt"
    additional_indicators:
      lucky_strike: "Floating golden star or 'LUCK!' text"
      morale_bonus: "Flags/icon animation + extra turn indicator"
      miss_blocked: "Not applicable (HoMM3 never misses, always deals damage)"

  hex_highlighting:
    hover: "Subtle outline glow on hovered hex"
    reachable_hexes: "Dark blue/teal overlay showing movement range"
    attack_target: "Red outline on targetable enemy hexes"
    ranged_no_penalty: "Bright highlight for within-range targets"
    ranged_penalty: "Dimmer highlight for long-range (50% damage) targets"

  hero_portrait:
    style: "Painted fantasy portrait, roughly 58x64 pixels in combat panel"
    detail_level: "High detail oil-painting style faces, armor, class-appropriate costume"
    animation: "Static portrait (not animated)"
    spell_cast_visual: "Hero portrait briefly lit up / sparkle when casting"

# ============================================================
# SECTION 3: GAME MECHANICS - EXACT NUMBERS
# ============================================================

combat_mechanics:

  turn_order:
    system: "Speed-based initiative (higher speed acts first)"
    phases_per_round:
      1: "Initial phase: all creatures by speed descending, attacker first in ties"
      2: "Morale/Wait phase: good morale extra actions + waited creatures in reverse speed order"
    speed_tiebreaking:
      same_faction: "Unit in lower army slot goes first"
      opposite_factions: "Side that has not had the most recent action goes first"
      first_round: "Attacker's creatures break ties"
    wait_mechanic: "Unit can forfeit current turn to act later (reverse speed order)"
    defend_mechanic: "Unit increases defense by 20% for the round, cannot act otherwise"

  damage_formula:
    base_calculation: |
      If stack_size <= 10:
        DMG_base = SUM of individual random rolls in [min_dmg, max_dmg] per creature
      Else:
        DMG_base = SUM of 10 random rolls × (stack_size / 10), rounded down

    attack_defense_modifier:
      positive_add: "Each point attacker_ATK > defender_DEF = +5% damage (max +300% at ADD=+60)"
      negative_add: "Each point defender_DEF > attacker_ATK = -2.5% damage (max -70% at ADD=-28)"

    full_formula: |
      DMG_final = DMG_base
        × (1 + I1[ATK bonus] + I2[skill bonus] + I3[specialty] + I4[luck] + I5[abilities])
        × (1 - R1[DEF penalty])
        × (1 - R2[Armorer] - R3[specialty])
        × (1 - R4[Shield spell])
        × (1 - R5[range penalty])
        × (1 - R6[wall obstacle])
        × (1 - R7[Blind retaliation])
        × (1 - R8[Petrify/Paralyze])

    hero_skill_modifiers:
      offense_skill: "+10%/+20%/+30% base damage (basic/advanced/expert)"
      armorer_skill: "-5%/-10%/-15% incoming damage"
      archery_skill: "+10%/+25%/+50% ranged damage"

    range_penalty:
      short_range: "No penalty (< 10 hexes)"
      long_range: "-50% damage (10+ hexes distance)"
      melee_penalty: "-50% when ranged unit is adjacent to enemy (can still shoot)"

  luck_system:
    values: {"-3": "Cursed", "-2": "Awful", "-1": "Bad", "0": "Normal", "+1": "Good", "+2": "Great", "+3": "Irish"}
    positive_luck_trigger_probability:
      "+1": "4.17% (1/24)"
      "+2": "8.33% (1/12)"
      "+3": "12.5% (1/8)"
    positive_luck_effect: "Deal exactly 2× total damage"
    negative_luck_trigger_probability:
      "-1": "8.33% (1/12)"
      "-2": "16.67% (1/6)"
      "-3": "25% (1/4)"
    negative_luck_effect: "Deal 0.5× total damage (HotA only; SoD has no negative luck)"
    immune_to_luck: ["Undead", "Golems", "Elementals"]

  morale_system:
    range: -3 to +3
    positive_morale_trigger:
      "+1": "4.17% (1/24)"
      "+2": "8.33% (1/12)"
      "+3": "12.5% (1/8)"
    positive_morale_effect: "Unit gets an immediate second action after current action"
    negative_morale_trigger:
      "-1": "8.33% (1/12)"
      "-2": "16.67% (1/6)"
      "-3": "25% (1/4)"
    negative_morale_effect: "Unit loses its turn (freezes in panic)"
    timing:
      positive: "Triggers AFTER the unit has acted"
      negative: "Triggers AT THE START of the unit's turn"
    immune_to_morale: ["Undead", "Golems", "Elementals"]
    key_modifiers:
      mixed_army_penalty: "-1 per alignment type mixed beyond 1"
      undead_in_army: "-1 morale for all living units in same army"
      leadership_basic: "+1 morale"
      leadership_advanced: "+2 morale"
      leadership_expert: "+3 morale"

  retaliation_system:
    default_retaliations_per_round: 1
    exceptions:
      griffin: 2
      royal_griffin: "unlimited"
      fangarm: "unlimited (HotA)"
    counterstrike_spell_bonus: "+1 or +2 extra retaliations"
    no_retaliation_creatures:
      - Nagas
      - Naga Queens
      - Cerberi
      - Devils
      - Arch Devils
      - Vampire Lords
      - Harpy Hags
      - Hydras
      - Chaos Hydras
      - Sprites
      - Psychic Elementals
      - Magic Elementals
    no_retaliation_note: "Attacked stack does NOT consume a retaliation charge when struck by no-retaliation unit"
    ranged_retaliation: "Ranged units do NOT retaliate against melee attacks by default"

  ranged_combat:
    obstacle_penalty: "-50% damage if wall or obstacle between shooter and target"
    adjacent_enemy_penalty: "-50% damage if shooter is adjacent to any enemy"
    minimum_penalty_when_both: "-50% (not stacked to -75%)"
    no_range_minimum_distance: "1-9 hexes = no range penalty"
    long_range_penalty_threshold: 10

  flying_units:
    movement: "Can cross any hex regardless of obstacles or enemy zones of control"
    attack_retaliation: "Subject to normal retaliation unless unit has no-retaliation ability"
    examples: "Angels, Griffins, Dragons, Harpy Hags, Pegasi, Air/Fire/Storm Elementals"

  two_hex_creatures:
    description: "Large creatures occupy 2 hexes on the battlefield"
    examples: "Dragons, Cyclops, Behemoths, Hydras, Titans, Devils"
    movement: "Must find 2 adjacent free hexes to stand on"

# ============================================================
# SECTION 4: SPELL SYSTEM
# ============================================================

spell_system:
  mana_formula: "Max spell points = Knowledge × 10"
  schools: ["Air Magic", "Earth Magic", "Fire Magic", "Water Magic"]
  school_proficiency_levels: ["None (basic effect)", "Basic", "Advanced", "Expert"]
  hero_spell_frequency: "One spell cast per round (can cast any time during allied creature's turn)"

  complete_spell_list:
    # Format: {school, level, sp_cost, effect_formula}

    # --- DAMAGE SPELLS ---
    magic_arrow:
      school: "All Schools"
      level: 1
      sp_cost: "5 (4 with school mastery)"
      damage: "10/20/30 + (power × 10)"
      target: "single enemy"

    lightning_bolt:
      school: "Air"
      level: 2
      sp_cost: "10 (8 mastery)"
      damage: "10/20/50 + (power × 25)"
      target: "single enemy"

    destroy_undead:
      school: "Air"
      level: 3
      sp_cost: "15 (12 mastery)"
      damage: "10/20/50 + (power × 10)"
      target: "all undead enemies"

    chain_lightning:
      school: "Air"
      level: 4
      sp_cost: "24 (20 mastery)"
      damage: "25/50/100 + (power × 40)"
      target: "up to 5 enemy stacks (damage halves each jump)"

    titans_lightning_bolt:
