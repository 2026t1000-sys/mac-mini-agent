# ============================================================
# SECTION 9: WHAT SEPARATES HoMM3 FROM CHEAP CLONES
# ============================================================

quality_differentiators:

  visual:
    pre_rendered_3d_sprites:
      description: "Sprites are baked 3D renders, not hand-drawn pixel art"
      result: "Smooth gradients, realistic anatomy, proper lighting/shadow"
      fake_it_with: "Use detailed pixel art at 64x64+ min, or procedural shading on vector sprites"

    animation_richness:
      frames_per_action: "6-16 frames per animation group (not 2-3 frame flip)"
      idle_animation: "Creatures always subtly moving (breathing, shifting)"
      separate_directional_attacks: "Distinct frames for attacking up/straight/down"
      death_animation: "Full death sequence ending in static corpse, not disappear"

    battlefield_artwork:
      style: "Detailed painted backgrounds, not tiled pattern"
      detail: "Each terrain has foreground elements (rocks, trees, bones) giving depth"
      parallax: "Some versions add subtle parallax on foreground elements"

    spell_effects:
      size: "Large, screen-filling effects for major spells (Armageddon, Chain Lightning)"
      layering: "Effects layer over sprites correctly (fire behind/around creatures)"
      duration: "0.5-2.0 seconds, not instant"

    damage_feedback:
      floating_numbers: "Every hit shows damage number floating up"
      hit_flash: "Creature briefly flashes white/red on hit"
      screen_shake: "Very subtle shake on heavy hits (optional, tasteful)"
      color_coding: "Large damage = larger red numbers; small = white"
      lucky_indicator: "Special golden flash + sound for lucky strikes"

    ui_polish:
      panel_art: "Panels have decorative stone/wood border artwork"
      button_states: "Buttons have distinct hover/press/disabled states"
      tooltips: "Hover any creature to see full stats popup"
      smooth_scrolling: "Combat log scrolls smoothly"

  mechanical:
    complex_damage_formula: "Not just ATK - DEF; full multiplicative modifier chain"
    initiative_subtleties: "Speed ties broken correctly; wait/defend mechanics"
    luck_and_morale: "Probabilistic special events (not just flat bonuses)"
    no_retaliation_variety: "Special abilities that meaningfully change tactics"
    spell_mastery: "Same spell at 3 different power levels (basic/advanced/expert)"

  audio:
    creature_specific_sounds: "Each creature has unique attack + death sound"
    positional_audio: "Hits on left side of screen sound from left"
    layered_ambient: "Background ambient + battle music play simultaneously"
    dynamic_music: "Victory/defeat stings on combat end, not abrupt stop"

  common_cheap_clone_failures:
    - "Static sprites (no animation, just a single image)"
    - "Generic placeholder hit sounds or no sounds"
    - "Flat colored hexes instead of terrain artwork"
    - "No damage numbers displayed"
    - "Creatures disappear on death instead of leaving corpse"
    - "Ignoring morale and luck systems"
    - "Single retaliation rules not implemented"
    - "No spell visual effects, just stat number changes"
    - "No creature idle animations"
    - "Spellbook is plain HTML list, not illustrated overlay"
    - "No directional attack differentiation"
    - "Panel art is flat grey boxes"
    - "Fonts are default browser sans-serif instead of styled fantasy font"

# ============================================================
# SECTION 10: TECHNICAL IMPLEMENTATION NOTES FOR AI CODE GEN
# ============================================================

implementation_notes:

  hex_grid_math:
    offset_type: "Even-row offset OR cube coordinate system recommended"
    hex_to_pixel:
      pointy_top: |
        x = hex_size * sqrt(3) * (col + 0.5 * (row & 1))
        y = hex_size * 1.5 * row
    pixel_to_hex: "Reverse of above + rounding to nearest hex center"
    neighbor_directions: 6
    distance_formula: "Cube coordinate: max(|dx|, |dy|, |dz|)"
    a_star_pathfinding: "Required for movement + AI; weight by terrain passability"

  animation_system:
    recommended: "Sprite sheet with CSS animation or Canvas requestAnimationFrame"
    frame_timing: "~80-120ms per frame for combat animations (8-12 fps)"
    idle_timing: "~150-200ms per frame for idle loops (5-7 fps)"
    state_machine: "Each creature has animation state: IDLE | MOVING | ATTACKING | HIT | DYING | DEAD"

  rendering_layers:
    order_back_to_front:
      1: "Background terrain art (static image)"
      2: "Terrain overlays / obstacles"
      3: "Hex grid overlay (semi-transparent)"
      4: "Movement/attack highlights"
      5: "Creature sprites (sorted by row, lower row = drawn last = appears in front)"
      6: "Spell effect animations"
      7: "Floating damage numbers"
      8: "UI panels (always on top)"

  recommended_js_approach:
    canvas: "HTML5 Canvas for battlefield rendering (better performance)"
    ui_panels: "HTML/CSS for panel elements (easier to style)"
    hybrid: "Canvas for game world + DOM overlay for UI = best of both"
    library_options:
      - "PixiJS (WebGL-accelerated, good for sprites)"
      - "Phaser 3 (full game framework with physics, input, scenes)"
      - "Plain Canvas2D (most control, most code)"

  priority_implementation_order:
    1: "Hex grid render + click/hover interaction"
    2: "Creature placement on hexes"
    3: "Turn order system (speed-based queue)"
    4: "Melee attack with retaliation"
    5: "Damage formula (ATK vs DEF)"
    6: "Death and corpse display"
    7: "Ranged attack with distance penalty"
    8: "Flying movement"
    9: "Spell system (start with 5-6 most common spells)"
    10: "Morale and luck events"
    11: "Hero portraits and stat panel"
    12: "Spell visual effects"
    13: "Floating damage numbers"
    14: "Audio"
    15: "Siege combat"
    16: "Full 9-faction creature roster"
