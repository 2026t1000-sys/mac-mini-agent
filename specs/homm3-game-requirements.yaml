      level: 3
      sp_cost: "12 (9 mastery)"
      damage: "15/30/60 + (power × 10)"
      target: "ring of 6 hexes (center excluded)"

    # --- BUFF/DEBUFF SPELLS ---
    haste: {school: "Air", level: 1, effect: "+3/+5 speed to friendly unit/all"}
    slow: {school: "Earth", level: 1, effect: "-75%/-(50%+1) speed to enemy unit/all"}
