    native_terrain: "grass"
    tier_1: {base: "Pikeman", upgraded: "Halberdier", atk: 4, def: 5, hp: 10, speed: 4, dmg: "1-3"}
    tier_2: {base: "Archer", upgraded: "Marksman", atk: 6, def: 3, hp: 10, speed: 5, dmg: "2-3", special: "Ranged; Marksman: 2 shots per turn"}
    tier_3: {base: "Griffin", upgraded: "Royal Griffin", atk: 8, def: 8, hp: 25, speed: 9, dmg: "3-6", special: "Flying; 2 retaliations (Royal: unlimited)"}
